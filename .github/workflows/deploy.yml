name: Build with Docker and Deploy to cPanel via FTP

on:
  push:
    branches:
      - main
      - dev-raj

concurrency:
  group: cpanel-ftp-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t my-app .

      - name: Extract Build Files from Docker
        run: |
          docker create --name temp_container my-app
          docker cp temp_container:/var/www/html ./build_output
          docker rm temp_container

      - name: Clean unwanted folders from build_output
        run: |
          rm -rf ./build_output/vendor
          rm -rf ./build_output/vendor_old
          rm -rf ./build_output/system
          rm -rf ./build_output/node_modules
          rm -rf ./build_output/storage
          rm -rf ./build_output/writable
          rm -rf ./build_output/brain
          rm -rf ./build_output/tests
          rm -rf ./build_output/docs
          rm -rf ./build_output/.github
          rm -rf ./build_output/public/upload
          rm -rf ./build_output/public/uploads
          rm -rf ./build_output/public/storage
          rm -rf ./build_output/public/assets/img/
          rm -rf ./build_output/.git
          rm -f ./build_output/.gitignore
          rm -f ./build_output/.gitattributes
          rm -f ./build_output/.editorconfig
          rm -f ./build_output/Dockerfile
          rm -f ./build_output/.env*

      - name: Deploy to cPanel via FTPS
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: SamKirkland/FTP-Deploy-Action@v4.3.6
          attempt_limit: 3
          attempt_delay: 30000
          with: |
            server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            server-dir: /
            local-dir: ./build_output/
            protocol: ftp
            port: 21
            timeout: 60000
            security: loose
            log-level: verbose
            exclude: |
              **/.git*
              **/.git*/**
              **/.github/**
              **/brain/**
              **/.env*
              **/vendor/**
              **/vendor_old/**
              **/system/**
              **/node_modules/**
              **/storage/**
              **/writable/**
              **/tests/**
              **/docs/**
              **/public/upload/**
              **/public/uploads/**
              **/public/storage/**